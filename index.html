<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#f7f3ec">
  <meta name="description" content="狗狗forever。">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="paw.svg" type="image/svg+xml">
  <link rel="stylesheet" href="styles.css">
  <title>狗狗｜陪伴的每一天</title>
</head>
<body>
  <div class="app-shell">
    <header class="topbar">
      <a class="brand" href="#home" aria-label="狗狗首頁"><span class="brand-mark">🐾</span><span>狗狗</span></a>
      <button class="icon-button" id="profileShortcut" aria-label="編輯狗狗資料">☻</button>
    </header>
    <main id="app" aria-live="polite"></main>
    <nav class="tabbar" aria-label="主要導覽">
      <button data-tab="home" class="tab active"><span>▣</span><small>寵物護照</small></button>
      <button data-tab="diary" class="tab"><span>▤</span><small>日記</small></button>
      <button data-tab="health" class="tab"><span>＋</span><small>健康</small></button>
      <button data-tab="profile" class="tab"><span>♡</span><small>狗狗</small></button>
      <button data-tab="readiness" class="tab"><span>✓</span><small>準備度</small></button>
    </nav>
  </div>
  <dialog id="entryDialog"><form id="entryForm" method="dialog"><div class="dialog-head"><div><p class="eyebrow" id="dialogEyebrow">留下今天</p><h2 id="dialogTitle">新增日記</h2></div><button class="icon-button close" value="cancel" aria-label="關閉">×</button></div><div id="dialogFields"></div><div class="dialog-actions"><button class="button secondary" value="cancel">取消</button><button class="button primary" id="saveEntry" value="default">儲存紀錄</button></div></form></dialog>
  <div id="toast" role="status" class="toast"></div>
  <input id="photoInput" type="file" accept="image/*" capture="environment" hidden>
  <script src="app.js"></script>
</body>
</html>
